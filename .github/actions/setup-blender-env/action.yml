name: Set up the locked Blender Python environment
description: >
  Installs the system libraries bpy links against, then Python 3.11 and the locked
  dependencies from uv.lock, and activates .venv so later steps can call `python`.
inputs:
  groups:
    description: "Extra dependency groups from pyproject.toml, space-separated (e.g. 'vision pdf')"
    default: ""
  apt:
    description: "Extra apt packages (e.g. 'ffmpeg fonts-dejavu-core')"
    default: ""
runs:
  using: composite
  steps:
    - name: System libraries bpy links against (no GPU needed)
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libx11-6 libxrender1 libxfixes3 libxi6 libxext6 \
          libxkbcommon0 libsm6 libice6 libgl1 ${{ inputs.apt }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        activate-environment: true
    - name: Locked dependencies
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
      run: |
        args=()
        for g in $GROUPS; do args+=(--group "$g"); done
        uv sync --frozen "${args[@]}"
        python -c "import bpy; print('bpy', bpy.app.version_string)"
