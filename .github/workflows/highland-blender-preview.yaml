name: Highland Blender preview

on:
  push:
    branches: [deliver/highland-owner-tour]
    paths: [".github/workflows/highland-blender-preview.yaml"]
  workflow_dispatch:
    inputs:
      samples:
        description: "Cycles CPU samples for the exterior phone preview"
        type: choice
        options: ["8", "16", "32"]
        default: "16"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender Python runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-6 libxrender1 libxfixes3 libxi6 libxext6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install --disable-pip-version-check bpy==5.0.1
      - name: Render exterior preview with Cycles CPU
        run: |
          python projects/highland-drone/blender_preview.py \
            --output build/highland-blender-preview \
            --samples "${{ inputs.samples }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highland-blender-exterior-preview
          path: build/highland-blender-preview/
          if-no-files-found: error
          retention-days: 14
