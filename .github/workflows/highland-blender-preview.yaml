name: Highland Blender preview

on:
  push:
    branches: [deliver/highland-owner-tour]
    paths: [".github/workflows/highland-blender-preview.yaml", ".github/actions/**", "uv.lock"]
  workflow_dispatch:
    inputs:
      samples:
        description: "Cycles CPU samples for the exterior phone preview"
        type: choice
        options: ["8", "16", "32"]
        default: "16"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-blender-env
      - name: Render exterior preview with Cycles CPU
        run: |
          python projects/highland/products/walkthrough/blender_preview.py \
            --output build/highland-blender-preview \
            --samples "${{ inputs.samples || '16' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: highland-blender-exterior-preview
          path: build/highland-blender-preview/
          if-no-files-found: error
          retention-days: 14
