name: Build & verify models

on:
  pull_request:
    paths: ["specs/**", "projects/*/specs/**", "projects/*/project.yaml", "takeoff/**", "src/**", ".github/workflows/build-models.yaml", ".github/actions/**", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["specs/**", "projects/*/specs/**", "projects/*/project.yaml", "takeoff/**", "src/**", ".github/workflows/build-models.yaml", ".github/actions/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec path, site, or site/spec to build (e.g. qp-cottage-a). Blank = all."
        required: false
      realistic:
        description: "Add Cycles realistic render (slower)"
        type: boolean
        default: false

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-blender-env

      - name: Build, verify, render
        env:
          SPEC: ${{ inputs.spec }}
          REALISTIC: ${{ inputs.realistic }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          flags=(); [ "$REALISTIC" = "true" ] && flags+=(--realistic)
          if [ -n "$SPEC" ]; then
            bm build "$SPEC" "${flags[@]}"
          elif [ "$EVENT" = "pull_request" ]; then
            bm build --changed "origin/$BASE_REF" "${flags[@]}"   # code/env changes rebuild everything
          else
            bm build "${flags[@]}"                                 # main push / dispatch: every spec
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: models-${{ github.sha }}
          path: build/
          retention-days: 30
