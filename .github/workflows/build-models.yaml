name: Build & verify models

on:
  pull_request:
    paths: ["specs/**", "tools/**", ".github/workflows/build-models.yaml", ".github/actions/**", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["specs/**", "tools/**", ".github/workflows/build-models.yaml", ".github/actions/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:
    inputs:
      spec:
        description: "One spec to build (e.g. specs/unit-204-deck.yaml). Blank = all."
        required: false
      realistic:
        description: "Add Cycles realistic render (slower)"
        type: boolean
        default: false

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-blender-env

      - name: Pick specs
        id: pick
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            echo "${{ inputs.spec }}" > specs.txt
          elif [ "${{ github.event_name }}" = "pull_request" ] && \
               ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(tools/|pyproject.toml|uv.lock|\.github/)'; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'specs/*.yaml' > specs.txt
          else
            ls specs/*.yaml > specs.txt   # builder/env changed or main push: rebuild everything
          fi
          cat specs.txt

      - name: Build, verify, render
        run: |
          FLAGS=""
          if [ "${{ inputs.realistic }}" = "true" ]; then FLAGS="--realistic"; fi
          status=0
          while read -r spec; do
            [ -f "$spec" ] || continue
            echo "::group::$spec"
            python tools/build.py "$spec" --out build $FLAGS || status=1
            echo "::endgroup::"
            name=$(basename "$spec" .yaml)
            [ -f "build/$name/report.md" ] && cat "build/$name/report.md" >> "$GITHUB_STEP_SUMMARY"
          done < specs.txt
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: models-${{ github.sha }}
          path: build/
          retention-days: 30
