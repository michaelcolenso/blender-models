name: Highland archviz still review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Blender and review tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-dejavu-core libx11-6 libxrender1 libxfixes3 libxi6 libxext6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install --disable-pip-version-check bpy==5.0.1 pillow
      - name: Build, validate, and render the upgraded native scene
        run: |
          python projects/highland-drone/build_blender.py \
            --output build/highland-archviz/Highland-archviz.blend \
            --frames 1,160,319,529 --width 540 --height 960 --samples 24 --threads 2
      - name: Render matching frames from the previous published scene
        run: |
          mkdir -p build/highland-archviz-before
          cp deliverables/highland-archviz/Highland-study-baseline.blend build/highland-archviz-before/Highland-study.blend
          python projects/highland-drone/build_blender.py --reuse \
            --output build/highland-archviz-before/Highland-study.blend \
            --frames 1,160,319,529 --width 540 --height 960 --samples 24 --threads 2
      - name: Package phone stills and comparisons
        run: python projects/highland-drone/review_archviz.py
      - uses: actions/upload-artifact@v4
        with:
          name: highland-archviz-stills-and-blender-scene
          path: deliverables/highland-archviz/
          if-no-files-found: error
          retention-days: 14
