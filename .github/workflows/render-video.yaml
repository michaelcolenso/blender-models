name: Render a model video

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Repository path to the saved video brief"
        type: string
        default: render/videos/highland-installation.json
      profile:
        description: "Storyboard, reduced preview, or native production"
        type: choice
        options: [storyboard, preview, production1080, production4k]
        default: storyboard
      shot:
        description: "One shot ID, or all"
        type: string
        default: all
      runner:
        description: "CPU for previews; production needs a configured NVIDIA GPU runner"
        type: choice
        options: [cpu, gpu]
        default: cpu

permissions:
  contents: read

concurrency:
  group: video-${{ github.ref }}-${{ inputs.recipe }}-${{ inputs.profile }}-${{ inputs.shot }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile exact frame assignments
        id: plan
        env:
          RECIPE: ${{ inputs.recipe }}
          PROFILE: ${{ inputs.profile }}
          SHOT: ${{ inputs.shot }}
          DEVICE: ${{ inputs.runner == 'gpu' && 'OPTIX' || 'CPU' }}
        run: |
          if [ "$DEVICE" = CPU ] && [[ "$PROFILE" == production* ]]; then
            echo "Production profiles require the gpu runner input. Use cpu for storyboard or preview."
            exit 1
          fi
          python3 tools/video_plan.py "$RECIPE" --profile "$PROFILE" --shot "$SHOT" \
            --device "$DEVICE" --output build/video-plan/plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-plan
          path: build/video-plan/plan.json
          overwrite: true
          retention-days: 14

  render:
    needs: plan
    runs-on: ${{ fromJSON(inputs.runner == 'gpu' && '["self-hosted","linux","x64","blender-gpu"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Keep the read-only job credential for targeted LFS asset retrieval.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: Install headless render runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git-lfs libx11-6 libxrender1 libxfixes3 libxi6 libxext6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install --disable-pip-version-check -r render/requirements.txt
      - name: Check planning and frame validation
        run: python -m unittest discover -s tests -p test_video_workflow.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: video-plan
          path: build/video-plan
      - name: Render this frame chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          mkdir -p build/video
          set -o pipefail
          python -u tools/render_video.py build/video-plan/plan.json --chunk "$CHUNK" \
            --output build/video 2>&1 | tee "build/video/$CHUNK.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: video-frames-${{ matrix.chunk }}
          path: build/video/
          overwrite: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  assemble:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install assembly dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg git-lfs
          python -m pip install --disable-pip-version-check Pillow==12.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: video-plan
          path: build/video-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: video-frames-*
          path: build/video
          merge-multiple: true
      - name: Verify complete frames and assemble
        run: |
          python tools/assemble_video.py build/video-plan/plan.json --frames build/video/frames --output build/video-delivery
          cp build/video-plan/plan.json build/video-delivery/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: video-delivery-${{ inputs.profile }}
          path: build/video-delivery/
          overwrite: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
