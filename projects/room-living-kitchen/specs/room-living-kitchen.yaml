# Living room / kitchen (occupied apartment) — PHOTO-ONLY model.
# Units: inches. World axes: x = left wall (0) -> kitchen wall (W); y = camera-end wall (0) -> art wall (D); z = up.
# There are NO drawings for this room. Nothing here is 'confirmed'. Scale comes from standard-size
# references visible in the photo (30" range, ~30" fridge, 8' ceiling, 36" counter, 80" door) and every
# position is estimated from one ultra-wide (~0.5x) photo with heavy edge distortion: tolerance +/-6" on
# positions, +/-12" on room width/depth, unknown on anything outside the frame.
project: Living room + kitchen + hall stub (photo-derived massing + furnishings)
tolerance_in: 0.25            # builder fidelity: built size vs size in this file (not accuracy to the real room)

sources:
  - id: P1
    ref: "Photo IMG (user upload 2026-10-11), ultra-wide, portrait 1500x2000, low light, TV on + one lamp"
    type: photo
    scale_refs: "30in range (width), stainless fridge (width ~30in), 8ft ceiling, 36in counter height, ~80in hall door, 65in TV class"
    limits: "Heavy wide-angle distortion at frame edges; no view of the camera-end wall, the left-most/right-most walls, or beyond the hall; no tape/plan."

room:
  width_in: 180      # x, left wall -> right (kitchen) wall
  depth_in: 200      # y, camera-end wall -> art wall
  ceiling_in: 96
  wall_t_in: 4.5
  hall: {x0: 112, x1: 148, length_in: 120}

# Provenance by group (trade/collection). status: provisional = visible in P1, size from a scale reference.
# assumed = not visible or not determinable; basis required.
groups:
  shell_visible:   {status: provisional, source: P1, trade: shell,     note: "Art wall, left (TV) wall, kitchen wall, ceiling, floor: visible; W/D estimated from furniture + appliance references"}
  shell_unseen:    {status: assumed, basis: "Camera-end wall is outside the frame; modeled as a plain hidden wall so the room closes. Window/door locations unknown", trade: shell}
  hall:            {status: provisional, source: P1, trade: shell, note: "Hall opening + first ~12ft visible; length and end door are massing"}
  hall_unseen:     {status: assumed, basis: "Hall length/side door/end door only partly visible; massing", trade: shell}
  casing_base:     {status: assumed, basis: "Typical 3.5in baseboard / 2.25in casing; profile not visible in P1", trade: finishes}
  kitchen:         {status: provisional, source: P1, trade: kitchen, note: "Range 30in, fridge ~30in wide, counter 36in; layout from photo"}
  kitchen_unseen:  {status: assumed, basis: "Upper cabinets, counter run length beyond range, items on counter: dark/partly visible", trade: kitchen}
  living:          {status: provisional, source: P1, trade: furniture, note: "Furniture massing sized from sofa seat/TV/standard reference"}
  living_detail:   {status: assumed, basis: "Cushion counts, pillows, throws, decor items approximated for look only", trade: furniture}
  lighting_fx:     {status: provisional, source: P1, trade: lighting, note: "String lights, lamp, vent, detector positions from photo"}

items:   # main footprints. 'faces' = direction the front faces. at = min corner of footprint, size = [dx, dy, dz]
  - {id: sofa,         group: living, at: [62, 52, 0],   size: [38, 90, 32], faces: "-x"}
  - {id: chaise,       group: living, at: [34, 164, 0],  size: [66, 36, 30], faces: "-y"}
  - {id: coffee_table, group: living, at: [24, 80, 0],   size: [24, 44, 16], faces: "+y"}
  - {id: rug,          group: living, at: [12, 46, 0],   size: [76, 108, 0.5], faces: "+y"}
  - {id: tv_console,   group: living, at: [0, 100, 0],   size: [18, 48, 24], faces: "+x"}
  - {id: tv,           group: living, at: [6, 95.5, 28], size: [2, 57, 33.5], faces: "+x"}
  - {id: armchair,     group: living, at: [4, 44, 0],    size: [34, 34, 31], faces: "+x", yaw: 30}
  - {id: side_basket,  group: living_detail, at: [3, 82, 0], size: [15, 15, 14], faces: "+x"}
  - {id: ottoman,      group: living, at: [106, 70, 0],  size: [22, 24, 17], faces: "-x"}
  - {id: lamp_table,   group: living, at: [102, 146, 0], size: [14, 14, 36], faces: "-x"}   # 22in table + ~14in lamp
  - {id: cat_tree,     group: living, at: [4, 168, 0],   size: [18, 18, 40], faces: "+x"}
  - {id: plant,        group: living, at: [2, 150, 0],   size: [18, 16, 44], faces: "+x", env_tol: 8}   # organic shape: envelope approximate
  - {id: art_diptych,  group: living, at: [0.5, 92, 40], size: [1.5, 56, 36], faces: "+x", env_tol: 1.0}
  - {id: art_sunburst, group: living, at: [44, 197.5, 34], size: [38, 1.5, 44], faces: "-y", env_tol: 1.5}
  - {id: frame_small,  group: living, at: [92, 197.5, 40], size: [18, 1, 9], faces: "-y"}
  - {id: fridge,       group: kitchen, at: [149, 64, 0], size: [31, 30, 67], faces: "-x"}
  - {id: range,        group: kitchen, at: [153.5, 98, 0], size: [26.5, 30, 41], faces: "-x"}   # 24in body flush to wall + 2.5in handle; 36in cooktop + 5in backguard
  - {id: micro_hood,   group: kitchen, at: [158, 98, 66], size: [16, 30, 16], faces: "-x"}
  - {id: base_cabs,    group: kitchen_unseen, at: [156, 128, 0], size: [24, 70, 34.5], faces: "-x"}
  - {id: counter,      group: kitchen_unseen, at: [155, 128, 34.5], size: [25, 70, 1.5], faces: "-x"}
  - {id: upper_cabs,   group: kitchen_unseen, at: [168, 134, 54], size: [12, 64, 30], faces: "-x"}

checks:   # internal-consistency checks (builder fidelity + clearances); none are document-driven
  - {kind: room_extents, expect: [180, 200, 96], note: "interior clear size (estimated)"}
  - {kind: gap, a: coffee_table, b: sofa, axis: x, expect: 14, tol: 3, note: "coffee table front to sofa seat front"}
  - {kind: gap, a: sofa, b: ottoman, axis: x, expect: 6, tol: 3, note: "sofa back to ottoman"}
  - {kind: gap, a: ottoman, b: fridge, axis: x, expect: 21, tol: 4, note: "walkway between ottoman and fridge"}
  - {kind: hall_width, expect: 36, tol: 0.1}
  - {kind: size_match, note: "every item's built bbox equals its size (+/- tolerance_in)"}
  - {kind: no_overlap, items: [sofa, chaise, coffee_table, armchair, tv_console, ottoman, lamp_table, cat_tree, fridge, range, base_cabs, plant], note: "footprints do not intersect"}
