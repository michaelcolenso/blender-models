# Field condition — raked parapet with metal coping at a roof-to-wall intersection. EXISTING.
# Source: one oblique site photo (P1). Section frame, inches: X = 0 at the roof-side face of the
# parapet sheathing, +X out over the roof, -X through the wall. Z = 0 at the shingle surface at
# the wall, plumb. Swept up the roof slope (coping follows the slope).
# Almost every dimension here is ASSUMED: one oblique photo has no reliable scale across planes.
# The one photo-derived quantity is the run length, from counting shingle courses along the wall.
project: Field parapet (photo P1) — EXISTING condition
tolerance_in: 0.125

sources:
  - {id: P1, ref: "Site photo P1 (sources/field/parapet-P1.jpg), Michael Colenso, 2026-09-27", type: photo}
  - {id: S1, ref: "Scope statement, M. Colenso 2026-09-27: coping remains; new roof-to-wall flashing and siding at back of parapet", type: scope}

field_verify:
  - "Roof pitch (rise per 12) — not measurable from one oblique photo; modeled 6/12"
  - "Run length along the slope, low end to gable end — photo count ≈ 20–22 courses (≈ 9–10 ft); tape it"
  - "Shingle type and exposure (3-tab 5\" vs laminated 5 5/8\") — sets course count → run length"
  - "Parapet height, shingle surface to underside of coping, at low and high ends — modeled 14\""
  - "Coping: top width, face-leg depth each side, hem/drip, fastening (face-fastened screws visible at the flat section)"
  - "Wall assembly: stud depth, sheathing, WRB type/condition, siding product and thickness"
  - "Dark band at wall base (joint every course): step flashing, or shingle pieces turned up the wall? Open one location"
  - "Condition at gable end top (dark patch — bare WRB/felt?) and at the low end / kickout"

elements:
  - id: parapet_existing
    type: detail
    path: {length_in: 102, pitch: 6}   # 102" horizontal = ~114" along a 6/12 slope (≈ 21 courses x 5 3/8")
    cutaway_step_in: 8
    cutaway_dir: [1.0, 0.7, 0.9]      # view from the roof side (+X), above, toward the stepped far end
    components:
      # --- roof ---
      - {id: roof_deck, label: "roof sheathing", trade: roofing, material: osb, rect: [0.0, -0.905, 36.0, -0.28],
         status: assumed, basis: "5/8\" deck typical; not visible"}
      - {id: underlayment, label: "underlayment", peel: 1, trade: roofing, material: membrane, rect: [0.0, -0.28, 36.0, -0.25],
         status: assumed, basis: "not visible"}
      - {id: shingles, label: "asphalt shingles (existing)", peel: 2, trade: roofing, material: shingles, rect: [0.0, -0.25, 36.0, 0.0],
         status: provisional, source: P1, basis: "visible; thickness typical"}
      - {id: base_apron, label: "dark band at wall base — step flashing or turned-up shingle? [verify]", peel: 3, trade: roofing,
         material: shingles, rect: [0.03, 0.0, 0.13, 5.0],
         status: provisional, source: P1, basis: "joint at every course; granule texture; ~5\" exposed height scaled against course spacing (rough)"}
      # --- parapet wall ---
      - {id: wall_framing, label: "parapet framing (2x6 assumed)", trade: framing, material: df_lumber, rect: [-6.0, -12.0, -0.5, 17.5],
         status: assumed, basis: "not visible; 2x6 assumed from coping width"}
      - {id: sheathing_roofside, label: "wall sheathing", peel: 1, trade: framing, material: osb, rect: [-0.5, -12.0, 0.0, 17.5],
         status: assumed, basis: "not visible"}
      - {id: wrb_existing, label: "WRB (existing, condition unknown)", peel: 2, trade: envelope, material: wrb, rect: [0.0, 0.0, 0.03, 17.5],
         status: assumed, basis: "not visible except possible exposure at gable-end top"}
      - {id: siding_roofside, label: "fiber-cement siding/trim, roof side (existing)", peel: 4, trade: siding, material: siding,
         rect: [0.13, 5.0, 0.88, 14.5],
         status: provisional, source: P1, basis: "visible; bottom ~5\" above shingles; thickness assumed 3/4\""}
      - {id: sheathing_ext, label: "wall sheathing, exterior side", trade: framing, material: osb, rect: [-6.5, -12.0, -6.0, 17.5],
         status: assumed, basis: "not visible"}
      - {id: siding_ext, label: "siding, exterior side", trade: siding, material: siding, rect: [-7.25, -12.0, -6.5, 14.5],
         status: assumed, basis: "far face not visible in P1"}
      # --- coping (to remain) ---
      - {id: coping_top, label: "prefinished metal coping (existing)", trade: sheet_metal, material: flashing, rect: [-7.75, 17.5, 1.45, 17.6],
         status: provisional, source: P1, basis: "visible; width assumed 9 1/4\" over a 2x6 wall"}
      - {id: coping_leg_roof, label: "coping face leg, roof side", trade: sheet_metal, material: flashing, rect: [1.35, 13.5, 1.45, 17.6],
         status: provisional, source: P1, basis: "visible; 4\" leg depth assumed"}
      - {id: coping_leg_ext, label: "coping face leg, exterior side", trade: sheet_metal, material: flashing, rect: [-7.75, 13.5, -7.65, 17.6],
         status: assumed, basis: "far side not visible"}

checks:
  - between: [shingles, z1, siding_roofside, z0]
    label: "existing siding clearance above shingles (as photographed, rough)"
    expect: 5.0
    source: P1
