# Steps run from the repo root: uv run bm run highland/showcase <step> [extra args for the last command]
# Env in every step: $BM_PRODUCT_DIR (this folder), $BM_BUILD (build/<site>/<product>), $BM_DELIVERABLES.
kind: "film"
description: "One Model: a Blender 5.3 showcase film on the generalized Highland massing (shot list and proof renders)"
deliverables: ../../deliverables/showcase
steps:
  # Blender 5.3 lives in its own uv project (env/, Python 3.13); see README.md. Grease Pencil needs EGL.
  proof: uv run --project $BM_PRODUCT_DIR/env --frozen python $BM_PRODUCT_DIR/proto.py $BM_BUILD/proof
  # CI: bpy-free shot-list check (timing on the beat, nothing identifying on screen).
  check: python $BM_PRODUCT_DIR/build.py --check
