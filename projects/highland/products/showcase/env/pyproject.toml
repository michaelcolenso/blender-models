# Separate uv environment for the showcase film only: Blender 5.3 needs Python 3.13, while the
# rest of the repository stays on Python 3.11 / bpy 5.0.1 (root pyproject.toml). Nothing here is
# imported by, or imports, the root project; scripts find the repo root from their own path.
[project]
name = "highland-showcase-env"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "bpy==5.3.0",
]

[tool.uv]
package = false
