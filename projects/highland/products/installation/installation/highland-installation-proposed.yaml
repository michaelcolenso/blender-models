limitations:
- All new pipe positions, elevations, diameters, supports, openings and working areas
  are assumed coordination geometry, not a measured design.
- Plan trace follows the P4.01 Unit B / 106 drawing relationships. No dimension-string
  calibration is available; presentation scale must not be used for takeoff.
- The circulation-return termination and balancing connection are proposed and must
  be traced in the field.
- Fixture-group endpoints are diagram symbols, not individual fixture rough-ins or
  verified fixture counts.
- Replacement material, hydraulic sizing, isolation boundaries and outage durations
  remain undecided.
- The shared distribution scene is a schematic; stack positions do not locate actual
  chases or establish affected units.
- The project title is 200 West Highland Drive; the drawing location block reads 202
  W Highland Drive, Seattle. Confirm address and governing revision.
