phases:
- id: 0
  title: Verify and protect
  caption: Trace all three services and prove isolation before scheduling the outage.
  work:
  - Confirm current revision and field-route every service.
  - Record pressures, temperatures and circulation performance.
  - Agree affected residents, unit access and contingency service.
  - Protect finishes; keep the actual egress route clear.
  gate: No demolition release until current routes, service boundaries and access
    are documented.
- id: 1
  title: Open and prepare
  caption: Open only the verified service zones; prepare supports and penetrations.
  work:
  - Inspect suspect finishes before disturbance.
  - Make controlled openings after concealed-service checks.
  - Document rated assemblies and select compatible listed penetration details.
  - Confirm sufficient space for new piping alongside live CPVC; otherwise revise
    the outage plan.
  gate: Access locations, support strategy and penetration details accepted before
    rough-in.
- id: 2
  title: Install distribution
  caption: Build new cold, hot and circulation-return paths as an isolated network.
  work:
  - Install replacement distribution without connecting to the live system.
  - Follow the selected system instructions for joints, supports, movement and insulation.
  - Maintain hot-water return continuity; retain access to balancing components.
  - Verify each proposed route against the opened conditions.
  gate: Material, hydraulic sizes, support spacing and return routing approved before
    installation.
- id: 3
  title: Branch, cap and test
  caption: Complete new branches; cap test boundaries and inspect before concealment.
  work:
  - Route hot/cold branches to the source-plan fixture groups.
  - Keep the kitchen low-wall route visible for coordination.
  - Isolate meters, controls and equipment that cannot withstand the test.
  - Test using the adopted code and manufacturer procedure; document inspection results.
  gate: New isolated piping passes the specified test and required rough inspection;
    final tie-ins remain to be checked.
- id: 4
  title: Cut over and commission
  caption: Transfer service only within a field-proven isolation boundary.
  work:
  - Notify affected occupants and establish the approved outage.
  - Isolate supply and return paths; drain before cutting brittle CPVC.
  - Transfer service, preserve/reconnect metering and alarm-linked shutoffs as applicable.
  - Flush and disinfect where required; check final tie-ins and simultaneous demand.
  - Verify hot-water temperature, return balance and alarm/shutoff operation.
  gate: Safe service and circulation restored; final connections inspected; abandoned
    CPVC disconnected without live dead legs.
- id: 5
  title: Restore and hand over
  caption: Close walls after acceptance; retain access to service components.
  work:
  - Complete documented firestop and assembly restoration; inspect before covering.
  - Restore finishes and maintain required access panels.
  - Label isolation valves and document routes with preclosure photographs.
  - Deliver as-builts, test records, balancing results and warranties.
  gate: Final acceptance and owner handover complete; no untested joints concealed.
