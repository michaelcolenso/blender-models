[project]
name = "blender-models"
version = "0.1.0"
description = "Dimensionally accurate, provenance-tracked Blender models of construction projects, built from specs."
readme = "README.md"
# bpy 5.0.x wheels are cp311 only.
requires-python = "==3.11.*"
dependencies = [
    "bpy==5.0.1",
    "pyyaml>=6,<7",
    "openpyxl>=3.1",
    "pillow>=12.3",
    "numpy>=1.26,<3",
    "shapely>=2",
]

[project.scripts]
bm = "bmodels.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# CIE is deliberately a second top-level module: it is the renderer-independent
# semantic kernel, while bmodels remains the existing Blender/project CLI.
module-name = ["bmodels", "cie"]

[dependency-groups]
# Drawing intake and PDF reports/storyboards.
pdf = ["pymupdf>=1.24", "reportlab>=4"]
# Compositing, grading, review sheets, plan extraction. 4.10 is the newest
# opencv that runs on numpy<2, which bpy 5.0.1 requires; this pin also keeps the
# graded cinema film reproducible.
vision = ["opencv-python-headless==4.10.0.84"]
# Narration and score generation.
audio = ["piper-tts", "scipy"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev", "pdf", "vision"]  # the whole spec pipeline; `audio` is opt-in

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
